<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPTV 订阅管理</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>📺 IPTV 订阅管理</h1>
  <div id="stats" class="stats"></div>
</header>

<nav class="tabs">
  <button class="tab active" data-tab="channels">频道管理</button>
  <button class="tab" data-tab="dupes">同名合并 <span id="dupeBadge" class="badge"></span></button>
  <button class="tab" data-tab="sources">订阅源</button>
  <button class="tab" data-tab="playlists">输出订阅</button>
</nav>

<main>
  <!-- 频道管理 -->
  <section id="tab-channels" class="tabpane active">
    <div class="toolbar">
      <input id="q" placeholder="搜索频道名…" oninput="debouncedLoad()">
      <select id="fCat" onchange="loadChannels(1)"><option value="">全部分类</option></select>
      <select id="fSrc" onchange="loadChannels(1)"><option value="0">全部来源</option></select>
      <select id="fEn" onchange="loadChannels(1)">
        <option value="">全部状态</option><option value="1">仅启用</option><option value="0">仅禁用</option>
      </select>
      <button onclick="loadChannels(1)">🔍 搜索</button>
    </div>
    <div id="batchBar" class="batchbar hidden">
      已选 <b id="selCount">0</b> 个：
      <button onclick="batchOp('enable')">启用</button>
      <button onclick="batchOp('disable')">禁用</button>
      <button onclick="batchSetCat()">归类…</button>
      <button onclick="batchOp('merge')">合并为一个</button>
      <button class="danger" onclick="batchOp('delete')">删除</button>
    </div>
    <table>
      <thead><tr>
        <th><input type="checkbox" id="selAll" onchange="toggleAll(this.checked)"></th>
        <th>频道名</th><th>分类</th><th>来源</th><th>状态</th><th>操作</th>
      </tr></thead>
      <tbody id="chBody"></tbody>
    </table>
    <div class="pager">
      <button onclick="page(-1)">‹ 上一页</button>
      <span id="pageInfo"></span>
      <button onclick="page(1)">下一页 ›</button>
    </div>
  </section>

  <!-- 同名合并 -->
  <section id="tab-dupes" class="tabpane">
    <p class="hint">按归一化频道名分组（忽略大小写、空格、高清/超清等后缀）。每组勾选要保留的频道，点"合并"只保留第一个勾选，其余删除。</p>
    <div id="dupeList"></div>
  </section>

  <!-- 订阅源 -->
  <section id="tab-sources" class="tabpane">
    <div class="card">
      <h3>➕ 添加订阅源</h3>
      <div class="formrow">
        <input id="srcName" placeholder="名称，如：范明俊直播源">
        <input id="srcUrl" placeholder="M3U 订阅链接 http(s)://…" style="flex:2">
        <input id="srcInterval" type="number" value="12" min="1" title="更新间隔（小时）" style="width:90px">
        <button onclick="addSource()">添加</button>
      </div>
    </div>
    <div id="srcList"></div>
  </section>

  <!-- 输出订阅 -->
  <section id="tab-playlists" class="tabpane">
    <div class="card">
      <h3>➕ 新建输出订阅</h3>
      <div class="formrow">
        <input id="plName" placeholder="订阅名称，如：客厅常用">
        <input id="plSearch" placeholder="关键词过滤（可选）">
        <label><input type="checkbox" id="plBackups"> 含备用源</label>
        <button onclick="addPlaylist()">创建</button>
      </div>
      <div class="formrow">
        <label>分类（多选，留空=全部）：</label>
        <div id="plCats" class="checklist"></div>
      </div>
    </div>
    <div class="card">
      <h3>📡 订阅链接（把下面链接填到播放器 / 机顶盒里）</h3>
      <p class="hint">局域网内用 <code id="lanHint"></code> 替换 <code>localhost</code> 即可。分类参数可用逗号分隔多个。</p>
      <div class="formrow">
        <code id="adhocUrl"></code>
        <button onclick="copyText(document.getElementById('adhocUrl').textContent)">复制</button>
      </div>
      <div class="formrow">
        <select id="adhocCat"><option value="">全部分类</option></select>
        <button onclick="updateAdhoc()">生成链接</button>
      </div>
    </div>
    <div id="plList"></div>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
